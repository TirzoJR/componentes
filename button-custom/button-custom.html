<div class="relative inline-block group">
  <button
    [type]="type"
    [disabled]="isDisabled"
    [class]="buttonClasses"
    [class.disabled]="isDisabled"
    [attr.aria-label]="ariaLabel || text"
  >
    @if (variant === 'icon-only' || variant === 'icon-danger') { @if (ariaLabel
    || text) {
    <div
      class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 hidden group-hover:flex flex-col items-center z-50 pointer-events-none"
    >
      <span
        class="bg-[#1c222b] text-white text-[13px] font-medium px-3 py-1.5 rounded-lg whitespace-nowrap shadow-md"
      >
        {{ ariaLabel || text }}
      </span>
      <div
        class="w-0 h-0 border-l-[6px] border-r-[6px] border-t-[6px] border-transparent border-t-[#1c222b] -mt-[1px]"
      ></div>
    </div>
    } @if (imageSrc) {
    <img [src]="imageSrc" [alt]="ariaLabel || text" [class]="imageClass" />
    } @else {
    <span class="material-symbols-outlined" [ngClass]="iconClass">
      {{ icon }}
    </span>
    } } @else { @if (iconPosition === 'left') { @if (imageSrc) {
    <img [src]="imageSrc" alt="" [class]="imageClass" />
    } @else if (icon) {
    <app-icon [iconName]="icon" size="sm" class="font-bold"></app-icon>
    } } @if (text !== '') {
    <span>{{ text }}</span>
    } @else {
    <ng-content></ng-content>
    } @if (iconPosition === 'right') { @if (imageSrc) {
    <img [src]="imageSrc" alt="" [class]="imageClass" />
    } @else if (icon) {
    <app-icon [iconName]="icon" size="sm" class="font-bold"></app-icon>
    } } }
  </button>

  @if (ariaLabel === 'Editar usuario') {
  <!-- Tooltip -->
  <span
    class="pointer-events-none absolute bottom-full left-1/2 mb-2 -translate-x-1/2 whitespace-nowrap rounded-xl bg-black px-2.5 py-2 text-sm text-white font-semibold opacity-0 transition-opacity group-hover:opacity-100"
  >
    Editar usuario
  </span>
  } @if (ariaLabel === 'Restablecer contraseña') {
  <!-- Tooltip -->
  <span
    class="pointer-events-none absolute bottom-full left-1/2 mb-2 -translate-x-1/2 whitespace-nowrap rounded-xl bg-black px-2.5 py-2 text-sm font-semibold text-white opacity-0 transition-opacity group-hover:opacity-100"
  >
    Restablecer Contraseña
  </span>
  } @if (ariaLabel === 'Deshabilitar Usuario') {
  <!-- Tooltip -->
  <span
    class="pointer-events-none absolute bottom-full mb-2 -translate-x-1/2 whitespace-nowrap rounded-xl bg-black px-2.5 py-2 text-sm text-white font-semibold opacity-0 transition-opacity group-hover:opacity-100"
    [class.-right-40]="isDisabled"
  >
    Deshabilitar Usuario @if (isDisabled) {
    <p class="text-xs text-[#7c8595]">
      No puedes quitarte el acceso a ti mismo.
    </p>
    }
  </span>
  }
</div>
