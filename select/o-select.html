<div class="flex flex-col w-full font-body">
  @if (field().label) {
    <label [for]="field().id || field().label" class="text-[#797980] text-sm font-medium ml-1 mb-4">
      {{ field().label }}
    </label>
  }

  <div class="relative w-full">
    <button
      [id]="field().id || field().label"
      type="button"
      (click)="toggleMenu()"
      [disabled]="disabled()"
      class="w-full flex items-center justify-between px-4 rounded-lg border transition-all outline-none"
      [ngClass]="{
        'py-2 text-sm': size() === 'sm',
        'py-[14px] text-base': size() === 'base',
        'py-5 text-lg': size() === 'lg',
        'border-gray-300 focus:border-converziia-primary ring-converziia-primary': !hasError,
        'border-red-500 text-red-600 focus:ring-red-500': hasError,
        'bg-gray-100 text-converziia-text-form hover:border-gray-400 hover:ring-0 cursor-not-allowed': disabled(),
      }"
    >
      <span class="truncate" [class.text-gray-400]="!selectedValue() || (multiple() && selectedValue().length === 0)">
        {{ displayText() }}
      </span>

      <app-icon iconName="arrow_drop_down" class="transition-transform duration-200" [class.rotate-180]="isOpen()" />
    </button>

    @if (isOpen()) {
      <div
        class="absolute z-50 min-w-full w-max bg-white border border-gray-200 rounded-lg shadow-xl overflow-hidden animate-in fade-in zoom-in duration-150"
        [ngClass]="position() === 'top' ? 'bottom-full mb-2' : 'top-full mt-2'"
      >
        @if (searchable()) {
          <div class="p-2 border-b border-gray-100 bg-gray-50">
            <input
              #searchInput
              type="text"
              [value]="searchOption()"
              (input)="searchOption.set($any($event.target).value)"
              placeholder="Buscar..."
              class="w-full px-3 py-2 text-sm border border-gray-200 rounded outline-none focus:border-converziia-primary"
              (click)="$event.stopPropagation()"
            />
          </div>
        }

        <ul class="max-h-[250px] overflow-y-auto py-1">
          @for (option of filteredOptions(); track option.value; let i = $index) {
            <li
              (click)="selectOption(option)"
              class="flex items-center px-4 py-3 text-sm cursor-pointer transition-colors hover:bg-gray-50"
              [ngClass]="{
                'bg-blue-50 text-converziia-primary font-medium': !multiple() && selectedValue() === option.value,
                'bg-gray-100': focusedIndex() === i,
              }"
              (keydown.enter)="selectOption(option)"
              [aria-hidden]="true"
            >
              @if (multiple()) {
                <input
                  type="checkbox"
                  [checked]="isValueSelected(option.value)"
                  class="mr-3 h-4 w-4 rounded border-gray-300 accent-converziia-secondary focus:ring-converziia-secondary"
                  (click)="selectOption(option); $event.stopPropagation()"
                  (keydown.enter)="selectOption(option); $event.stopPropagation()"
                />
              }
              {{ option.label }}
            </li>
          } @empty {
            <li class="px-4 py-8 text-center text-gray-400 text-sm italic">No se encontraron resultados</li>
          }
        </ul>
      </div>
    }
  </div>

  <div class="error-slot">
    <p class="error-text" [class.visible]="activeErrorMessage">
      {{ activeErrorMessage || '' }}
    </p>
  </div>
</div>
