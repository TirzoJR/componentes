<div class="flex flex-col w-full font-body">
  @if (field().label) {
    <label [for]="field().id || field().label" class="text-[#797980] text-sm font-medium ml-1 mb-4">
      {{ field().label }}
    </label>
  }

  <div class="relative flex items-center" [ngClass]="[size()]">
    <input
      #input
      [id]="field().id || field().label"
      [type]="inputType()"
      [attr.maxlength]="maxlength()"
      [attr.autocomplete]="field().attributes?.autocomplete || null"
      [value]="value()"
      [placeholder]="field().placeholder || ''"
      [disabled]="isDisabled()"
      [readOnly]="readonly()"
      (input)="handleInput(input.value)"
      (blur)="_onTouched()"
      class="w-full px-4 rounded-lg border transition-all outline-none"
      [ngClass]="{
        'py-2 text-sm': size() === 'sm',
        'py-[14px] text-base': size() === 'base',
        'py-5 text-lg': size() === 'lg',
        'border-gray-300 focus:border-converziia-primary focus:ring-1 focus:ring-converziia-primary':
          !activeErrorMessage,
        'border-red-500 focus:ring-1 focus:ring-red-500': activeErrorMessage,
        'bg-gray-100 text-converziia-text-form hover:border-gray-400 hover:ring-0 cursor-not-allowed': isDisabled(),
        'pr-12': isPasswordField(),
      }"
    />

    @if (isPasswordField()) {
      <div
        class="absolute right-3 cursor-pointer flex items-center"
        (click)="togglePasswordVisibility()"
        (keydown.enter)="togglePasswordVisibility()"
        (keydown.space)="togglePasswordVisibility(); $event.preventDefault()"
        [aria-hidden]="true"
      >
        <app-icon [iconName]="!showPassword() ? 'visibility_off' : 'visibility'" size="sm" iconColor="text-gray-500" />
      </div>
    }
  </div>

  <div class="flex justify-between items-start w-full mt-1">
    <div class="error-slot">
      <p class="error-text" [class.visible]="activeErrorMessage">
        {{ activeErrorMessage || '' }}
      </p>
    </div>

    @if (showCounter() && maxlength()) {
      <div class="text-xs transition-colors ml-2" [ngClass]="isCounterInvalid() ? 'text-red-500' : 'text-gray-900'">
        {{ currentLength() }}/{{ maxlength() }}
      </div>
    }
  </div>
</div>
