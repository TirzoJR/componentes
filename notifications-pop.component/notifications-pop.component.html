<div
  class="
    pointer-events-none
    fixed
    bottom-4
    left-1/2
    z-[60]
    flex
    w-[min(94vw,26rem)]
    -translate-x-1/2
    flex-col
    gap-2
  "
>
  @if (toast(); as data) {

    <output
      class="
        pointer-events-auto
        flex items-start gap-2.5
        rounded-xl
        border
        px-4 py-3
        text-sm
        shadow-pop
        bg-surface
      "
      [class.bg-tint-success]="data.type === 'success'"
      [class.text-success]="data.type === 'success'"

      [class.bg-tint-warning]="data.type === 'warning'"
      [class.text-warning]="data.type === 'warning'"

      [class.bg-tint-danger]="data.type === 'danger'"
      [class.text-danger]="data.type === 'danger'"

      [class.bg-tint-primary]="data.type === 'info'"
      [class.text-primary]="data.type === 'info'"
    >

      <!-- ICONO -->
      <span class="mt-0.5 shrink-0">

        @if (data.type === 'success') {

          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4.5 12.5l5 5 10-11"></path>
          </svg>

        } @else if (data.type === 'warning') {

          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 9v4"></path>
            <path d="M12 17h.01"></path>
            <path
              d="M10.3 4.5 2.8 18a2 2 0 0 0 1.75 3h14.9a2 2 0 0 0 1.75-3L13.7 4.5a2 2 0 0 0-3.4 0Z"
            ></path>
          </svg>

        } @else if (data.type === 'danger') {

          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12"></path>
            <path d="M18 6 6 18"></path>
          </svg>

        } @else {

          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M12 11v5"></path>
            <path d="M12 8h.01"></path>
          </svg>

        }

      </span>

      <!-- MENSAJE -->
      <p class="flex-1 leading-relaxed">
        {{ data.message }}
      </p>

      <!-- CERRAR -->
      @if (data.closable) {

        <button
          type="button"
          aria-label="Cerrar aviso"
          class="
            shrink-0
            opacity-60
            transition-opacity
            hover:opacity-100
          "
          (click)="close()"
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 6l12 12"></path>
            <path d="M18 6 6 18"></path>
          </svg>
        </button>

      }

    </output>

  }
</div>
