<button
  (click)="menuOpen()"
  class="fixed top-4 left-4 z-40 grid size-10 place-items-center rounded-xl border border-line bg-surface text-ink-soft shadow-card lg:hidden"
  aria-label="Abrir menú"
  aria-expanded="false"
  [class.translate-x-[190px]]="isHidden()"
>
  @if (!isHidden()) {
    <span class="material-symbols-outlined"> menu </span>

  } @else {
    <span class="material-symbols-outlined"> close </span>
  }
</button>

<div
  class="fixed inset-0 z-20 bg-ink/30 lg:hidden"
  [class.hidden]="!isHidden()"
  (click)="menuOpen()"
  onkeydown=""
></div>

<aside
  [class.-translate-x-full]="!isHidden()"
  class="fixed inset-y-0 left-0 z-30 flex w-[252px] shrink-0 flex-col overflow-hidden bg-surface px-3 py-4 transition-transform lg:translate-x-0"
>
  <a class="mb-6 block shrink-0 px-3" routerLink="/admin-kioscos/dashboard" data-discover="true">
    <img [src]="logoIcon" alt="logo" />
  </a>
  <nav class="min-h-0 flex-1 overflow-y-auto">
    @for (section of optionsMenu; track section) {
      <app-sections-menu
        [nameSection]="section.nameSection"
        [itemsSection]="section.items"
      ></app-sections-menu>
    }
  </nav>
  <div class="mt-4 shrink-0 border-t border-line px-3 pt-4">
    <div class="flex items-center gap-2.5">
      <span
        class="grid size-9 shrink-0 place-items-center rounded-full bg-tint-primary text-xs font-semibold text-primary"
        >{{initialsName}}</span
      ><span class="min-w-0"
        ><span class="block truncate text-sm font-medium text-ink">{{user?.name}}</span
        ><span class="block text-[11px] text-muted">{{roleSelected}}</span></span
      >
    </div>
    <button (click)="closeSession()"  class="mt-3 flex items-center gap-2 text-sm text-muted transition-base hover:text-ink">
      <span class="material-symbols-outlined text-base text-[#6B7280]">
        move_item
      </span>
      Cerrar sesión
    </button>
  </div>
</aside>
