<div
  class="fixed inset-0 z-50 flex items-end justify-center bg-ink/45 p-0 backdrop-blur-[2px] sm:items-center sm:p-4"
  aria-modal="true"
>
  <div
    class="flex max-h-[92vh] w-full flex-col overflow-hidden rounded-t-3xl border border-line bg-surface shadow-pop sm:rounded-2xl"
    [ngClass]="maxWidthClass"
  >
    <header class="flex items-start justify-between gap-4 border-b border-line px-5 pt-4">
      <div>
        <h2 class="text-base font-semibold text-ink">{{ titleForm }}</h2>
      </div>
      <button
        (click)="closeModal()"
        aria-label="Cerrar"
        class="rounded-lg p-1.5 text-muted transition-base hover:bg-surface-alt hover:text-ink"
      >
        <span class="material-symbols-outlined"> close </span>
      </button>
    </header>

    <div class="min-h-0 flex-1 overflow-y-auto">
      <ng-content></ng-content>
    </div>

    <footer class="flex flex-wrap justify-end gap-2 border-t border-line bg-app/60 px-5 py-4">
      @if (cancelButton) {
        <app-button-custom
          [text]="textCloseButton"
          variant="secondary"
          (click)="closeModal()"
          onkeypress=""
        ></app-button-custom>
      }

      <app-button-custom
        [text]="textConfirmButton"
        variant="primary"
        [isDisabled]="isConfirmDisabled"
        (click)="sendInformation()"
        onkeypress=""
      ></app-button-custom>
    </footer>
  </div>
</div>
